name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: python -m pip install --upgrade pip && pip install -e '.[dev]'
      - name: Test
        run: pytest
      - name: Ruff
        run: ruff check src tests
      - name: Clean-Clone Evaluation
        run: |
          python tests/eval_harness/generate_fixtures.py
          python src/pdfresearch/eval.py

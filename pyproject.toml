[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pdfresearch"
version = "0.1.0"
description = "Local-first deduplication and document-boundary recovery for huge merged PDFs"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Josh Parris"}]
dependencies = [
  "PyMuPDF>=1.24.0",
]

[project.scripts]
pdfresearch = "pdfresearch.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

# Keep CI focused on correctness errors. Style-oriented Ruff rule families change
# frequently; reviewers can still run `ruff check --select ALL` locally when wanted.
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
ignore = ["F401"]
